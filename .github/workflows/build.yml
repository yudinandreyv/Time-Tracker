name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller PyQt5

      - name: Build
        run: pyinstaller --onefile --clean --name time-tracker main.py

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-linux
          path: dist/time-tracker

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller PyQt5

      - name: Build
        run: pyinstaller --onefile --clean --name time-tracker main.py

      - name: Create .app bundle
        run: |
          APP="dist/TimeTracker.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp dist/time-tracker "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" << 'PLIST'

          name: time-tracker-macos
          path: dist/TimeTracker.app
